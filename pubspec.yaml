name: kashsense
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.70.2
  file_picker: ^10.3.2
  firebase_auth: ^6.0.2
  firebase_core: ^4.0.0
  shared_preferences: ^2.2.2
  cloud_firestore: ^6.4.1
  crypto: ^3.0.2
  firebase_ai: ^3.14.1
  firebase_app_check: ^0.4.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/KashSenseIcon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JETBRAINSMONO-REGULAR.TTF
        - asset: assets/fonts/JETBRAINSMONO-ITALIC.TTF
          style: italic
        - asset: assets/fonts/JETBRAINSMONO-MEDIUM.TTF
          weight: 500
        - asset: assets/fonts/JETBRAINSMONO-MEDIUM-ITALIC.TTF
          weight: 500
          style: italic
        - asset: assets/fonts/JETBRAINSMONO-BOLD.TTF
          weight: 700
        - asset: assets/fonts/JETBRAINSMONO-BOLD-ITALIC.TTF
          weight: 700
          style: italic
        - asset: assets/fonts/JETBRAINSMONO-EXTRABOLD.TTF
          weight: 800
        - asset: assets/fonts/JETBRAINSMONO-EXTRABOLD-ITALIC.TTF
          weight: 800
          style: italic
